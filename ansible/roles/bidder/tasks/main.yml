# 竞价服务的"机器部分"：用户、目录、systemd 服务。
# 程序本身由 build.yml / deploy.yml 按版本发布到 releases/<版本>/。
- name: 创建服务专用用户 rtb（不能登录）
  ansible.builtin.user:
    name: rtb
    system: true
    create_home: false
    shell: /sbin/nologin

- name: 创建程序和日志目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: rtb
    group: rtb
    mode: "0755"
  loop: ["{{ bidder_home }}", "{{ bidder_home }}/releases", /var/log/rtb-bidder]

- name: 删除版本化之前的旧目录 classes/
  ansible.builtin.file: { path: "{{ bidder_home }}/classes", state: absent }

- name: 安装 systemd 服务文件
  ansible.builtin.copy:
    src: "{{ repo_root }}/deploy/rtb-bidder.service"
    dest: /etc/systemd/system/rtb-bidder.service
    mode: "0644"
  notify: restart rtb-bidder

- name: 开机自启（第一次部署时还没有版本，由 deploy.yml 启动）
  ansible.builtin.systemd: { name: rtb-bidder, enabled: true, daemon_reload: true }

- name: 检查是否已经发布过版本
  ansible.builtin.stat: { path: "{{ bidder_home }}/current" }
  register: bidder_current
