- name: 安装 Prometheus 和 promtool
  ansible.builtin.include_role:
    name: prom_binary
  vars:
    pb_name: prometheus
    pb_version: "{{ prometheus_version }}"
    pb_bins: [prometheus, promtool]
    pb_service: prometheus

- name: 创建服务专用用户
  ansible.builtin.user: { name: prometheus, system: true, create_home: false, shell: /sbin/nologin }

- name: 创建配置和数据目录
  ansible.builtin.file: { path: "{{ item.path }}", state: directory, owner: "{{ item.owner }}", group: "{{ item.owner }}", mode: "0755" }
  loop:
    - { path: /etc/prometheus, owner: root }
    - { path: /etc/prometheus/rules, owner: root }
    - { path: /var/lib/prometheus, owner: prometheus }

- name: 安装告警规则（先用 promtool 检查语法）
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/prometheus/rules/
    mode: "0644"
    validate: /usr/local/bin/promtool check rules %s
  with_fileglob: ["{{ repo_root }}/monitoring/alerts/*.yml"]
  notify: reload prometheus

- name: 安装主配置（先用 promtool 检查语法）
  ansible.builtin.copy:
    src: "{{ repo_root }}/monitoring/prometheus.yml"
    dest: /etc/prometheus/prometheus.yml
    mode: "0644"
    validate: /usr/local/bin/promtool check config --syntax-only %s
  notify: reload prometheus

- name: 安装 systemd 服务文件
  ansible.builtin.copy:
    src: "{{ repo_root }}/monitoring/systemd/prometheus.service"
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
  notify: restart prometheus

- name: 开机自启并启动
  ansible.builtin.systemd: { name: prometheus, enabled: true, state: started, daemon_reload: true }
