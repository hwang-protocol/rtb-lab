- name: 添加 Grafana 官方软件源
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/grafana/tasks/repo.yml"

- name: "安装 Alloy {{ alloy_version }}"
  ansible.builtin.dnf:
    name: "alloy-{{ alloy_version }}"
    state: present
  notify: restart alloy

- name: Alloy 用户要能读 journald
  ansible.builtin.user: { name: alloy, groups: systemd-journal, append: true }
  notify: restart alloy

- name: 安装配置（先用 alloy fmt 检查语法）
  ansible.builtin.copy:
    src: "{{ repo_root }}/monitoring/alloy/config.alloy"
    dest: /etc/alloy/config.alloy
    mode: "0644"
    validate: /usr/bin/alloy fmt %s
  notify: restart alloy

- name: 界面和 /metrics 只监听本机；关闭匿名统计上报
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/alloy
    regexp: "^CUSTOM_ARGS="
    line: 'CUSTOM_ARGS="--server.http.listen-addr=127.0.0.1:12345 --disable-reporting"'
  notify: restart alloy

- name: 开机自启并启动
  ansible.builtin.systemd: { name: alloy, enabled: true, state: started, daemon_reload: true }
