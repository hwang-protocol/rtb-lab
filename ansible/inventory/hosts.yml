# 机器清单：先只有 UTM 虚拟机一台。上 EC2 以后由 Terraform 输出生成新的清单。
all:
  children:
    bidder:        # 运行竞价服务
      hosts:
        rocky9:
    loadgen:       # 运行压测程序
      hosts:
        rocky9:
    monitoring:    # 运行 Prometheus / Alertmanager / Grafana / Loki
      hosts:
        rocky9:
  vars:
    # rocky9 是 ~/.ssh/config 里的别名（127.0.0.1:2222，用户 lab），Ansible 直接沿用
    ansible_user: lab
