# 切换到某个版本并确认它健康。参数：release（版本号）
# deploy.yml 和 rollback.yml 共用；任何一步失败，调用方决定怎么处理。
- name: "切换 current → releases/{{ release }}"
  ansible.builtin.file:
    src: "{{ bidder_home }}/releases/{{ release }}"
    dest: "{{ bidder_home }}/current"
    state: link
    force: true

- name: 重启竞价服务（符号链接只在启动时解析，必须重启）
  ansible.builtin.systemd: { name: rtb-bidder, state: restarted, daemon_reload: true }

# 一边等健康检查通过，一边看 systemd 的自动重启次数 NRestarts（手动 restart 时归零）。
# 只要它大于 0，说明新版本启动后崩溃、被 systemd 拉起过，不用等满重试次数，立刻判定失败。
# 演练 #03：只看健康检查时，坏版本要 20 秒才判定失败，服务中断约 28 秒。
- name: "健康检查：/health 返回的版本必须是 {{ release }}；发现反复崩溃就立刻失败"
  ansible.builtin.shell: |
    for i in $(seq 1 {{ health_retries | default(20) }}); do
      if curl -sf http://127.0.0.1:8080/health | grep -qx "ok {{ release }}"; then
        echo "健康：第 ${i} 次检查通过"; exit 0
      fi
      restarts=$(systemctl show -p NRestarts --value rtb-bidder)
      if [ "$restarts" -gt 0 ]; then
        echo "新版本启动后崩溃，已被 systemd 自动重启 ${restarts} 次。最近的日志："
        journalctl -u rtb-bidder -n 3 --no-pager -o cat
        exit 1
      fi
      sleep 0.5
    done
    echo "超时：$(( {{ health_retries | default(20) }} / 2 )) 秒内健康检查没有通过"; exit 1
  args: { executable: /bin/bash }
  changed_when: false

- name: 冒烟测试：发一个真实的竞价请求，必须返回 200（出价）或 204（不出价）
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/bid
    method: POST
    body_format: json
    body:
      id: deploy-smoke
      imp: [{ id: "1", bidfloor: 0.5, banner: { w: 300, h: 250 } }]
      site: { domain: smoke.example, cat: [IAB12] }
      device: { geo: { country: USA } }
      user: { id: u-smoke }
      tmax: 50
    status_code: [200, 204]

- name: 记录发布历史（只有健康检查和冒烟测试都通过才记录）
  ansible.builtin.shell: "echo \"$(date -Is) {{ release }}\" >> {{ bidder_home }}/HISTORY"
