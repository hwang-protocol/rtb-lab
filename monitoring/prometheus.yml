# Prometheus 配置：每 5 秒抓取一次各个目标的 /metrics
global:
  scrape_interval: 5s
  evaluation_interval: 5s

# 告警规则文件
rule_files:
  - /etc/prometheus/rules/*.yml

# 触发的告警发给谁
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: alertmanager        # Alertmanager 自己的运行指标
    static_configs:
      - targets: ["127.0.0.1:9093"]

  - job_name: prometheus          # Prometheus 自己
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node                # 整台机器：CPU、内存、磁盘、网络、TCP 状态；以及压测程序写的 textfile
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: rtb-bidder          # 竞价服务
    static_configs:
      - targets: ["127.0.0.1:8080"]
